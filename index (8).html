<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الظل الأخير</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d12; --panel:#12151c; --panel2:#181c26; --line:#2a2f3d;
  --text:#e6e2d8; --muted:#8c8f99; --gold:#d4a24c; --gold2:#f0c878; --red:#b8423a;
  --wmax:640px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:'Cairo','Segoe UI',Tahoma,sans-serif;
  overflow:hidden; -webkit-tap-highlight-color:transparent;
}

/* خلفية الفصل (تظهر واضحة في القائمة، ومعتمة ومموّهة أثناء اللعب) */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1a1f2e,#07080c)}
.bgl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;
  transition:opacity 1.4s ease,filter .6s ease,transform .6s ease}
.bgl.show{opacity:1}
body.playing .bgl{filter:blur(16px) brightness(.42) saturate(1.1);transform:scale(1.1)}

#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.55}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(to top,rgba(8,9,13,.92) 0%,rgba(8,9,13,.6) 40%,transparent 72%),
    linear-gradient(to bottom,rgba(8,9,13,.7) 0%,transparent 16%),
    radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.7) 100%)}
.screen{position:fixed;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;overflow-y:auto;padding:20px 16px}
.screen.active{display:flex}

/* ---------- القائمة ---------- */
#menu{justify-content:center;justify-content:safe center;text-align:center;gap:10px}
.logo-sub{color:var(--gold);letter-spacing:6px;font-size:.9rem}
h1.title{font-family:'Amiri',serif;font-size:clamp(3rem,12vw,6rem);color:var(--gold2);
  text-shadow:0 0 30px rgba(212,162,76,.35);line-height:1.1}
.tagline{color:var(--muted);max-width:420px;margin-bottom:26px;line-height:1.9}
.btn{
  font-family:inherit;font-size:1.05rem;cursor:pointer;
  background:transparent;color:var(--text);border:1px solid var(--line);
  padding:12px 28px;border-radius:4px;min-width:240px;transition:.2s;
}
.btn:hover{border-color:var(--gold);color:var(--gold2);background:rgba(212,162,76,.07)}
.btn.primary{border-color:var(--gold);color:var(--gold2)}
.btn[disabled]{opacity:.35;pointer-events:none}
.menu-btns{display:flex;flex-direction:column;gap:12px;align-items:center}

/* ---------- شاشة اللعب ---------- */
#game{padding:0;align-items:stretch;justify-content:flex-start;overflow:hidden}

/* الشريط العلوي: ثابت دائماً */
.topbar{
  flex:none;display:flex;align-items:center;gap:10px;position:relative;z-index:5;
  padding:8px max(14px,calc((100vw - var(--wmax))/2));
  background:rgba(11,13,18,.9);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.tb-main{flex:1;min-width:0}
.brand{color:var(--gold);font-size:.72rem;letter-spacing:3px}
.tb-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tb-title{font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-title b,.tb-stage b{color:var(--gold2)}
.tb-stage{color:var(--muted);font-size:.78rem;white-space:nowrap}
.dots{display:flex;gap:4px;width:100%;margin-top:6px}
.dots i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:.4s}
.dots i.done{background:var(--gold)}
.dots i.now{background:var(--gold2);box-shadow:0 0 8px var(--gold)}
.icons{display:flex;gap:8px;flex:none}
.icon-btn{background:var(--panel);border:1px solid var(--line);color:var(--text);
  width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.05rem;transition:.2s}
.icon-btn:hover{border-color:var(--gold)}

/* منطقة المحتوى: هي الوحيدة التي تتحرك إن زاد المحتوى عن الشاشة */
#stage{flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:14px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.inner{width:100%;max-width:var(--wmax);margin:0 auto}

.thumb{
  overflow:hidden;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:#0e1016;
  height:clamp(130px,26vh,230px);height:clamp(130px,26dvh,230px);
}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.thumb.none{display:none}
.thumb.none + .card{border-radius:10px}

.card{
  background:linear-gradient(180deg,rgba(24,28,38,.94),rgba(18,21,28,.96));
  border:1px solid var(--line);border-radius:0 0 10px 10px;padding:16px 18px;
  box-shadow:0 14px 36px rgba(0,0,0,.45);
}
.scene{color:var(--gold);font-size:.82rem;margin-bottom:8px;letter-spacing:.5px}
.scene::before{content:"◆ ";font-size:.6rem}
#text{font-family:'Amiri',serif;font-size:clamp(19px,5vw,23px);line-height:1.9}
#text p{margin:0 0 .5em;white-space:pre-wrap}
#text .h{visibility:hidden}

/* شريط الدليل الجديد */
.banner{display:none;margin-top:10px;padding:10px 14px;border:1px solid var(--gold);border-radius:8px;
  background:rgba(212,162,76,.1)}
.banner.has{display:block;visibility:hidden}
.banner.has.show{visibility:visible;animation:rise .45s both}
.banner .b-head{display:block;color:var(--gold2);font-weight:700;font-size:.85rem}
.banner .b-text{display:block;margin-top:2px;line-height:1.7;font-size:.9rem}

/* الخيارات: تحجز مكانها من البداية وتظهر بعد انتهاء الكتابة */
#cw .ask{color:var(--muted);font-size:.88rem;margin:16px 4px 8px;visibility:hidden}
#cw.ready .ask{visibility:visible}
#choices{display:flex;flex-direction:column;gap:8px}
.choice{
  font-family:inherit;font-size:.98rem;text-align:right;cursor:pointer;line-height:1.6;
  background:rgba(18,21,28,.92);color:var(--text);border:1px solid var(--line);
  border-right:3px solid var(--gold);padding:12px 14px;border-radius:6px;
  opacity:0;transform:translateY(8px);visibility:hidden;transition:background .2s,border-color .2s;
}
.choice:hover{background:#1c2130;border-color:var(--gold)}
.choice:nth-child(2){animation-delay:.1s}.choice:nth-child(3){animation-delay:.2s}.choice:nth-child(4){animation-delay:.3s}
#cw.ready .choice{visibility:visible;animation-name:rise;animation-duration:.45s;animation-fill-mode:both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);z-index:30;
  background:var(--panel2);border:1px solid var(--gold);color:var(--gold2);padding:10px 18px;border-radius:6px;
  transition:.4s;font-size:.95rem;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ---------- نهاية الفصل ---------- */
#endscreen{justify-content:center;justify-content:safe center;text-align:center;gap:14px;max-width:560px;margin:0 auto}
#endscreen h2{font-family:'Amiri',serif;font-size:2.4rem;color:var(--gold2)}
.stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);padding:10px 18px;border-radius:6px}
.stat b{display:block;font-size:1.5rem;color:var(--gold2)}
.stat span{color:var(--muted);font-size:.8rem}

/* ---------- المفكرة والصوت ---------- */
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--gold);border-radius:8px;width:100%;max-width:460px;max-height:80vh;overflow:auto;padding:22px}
.modal h3{font-family:'Amiri',serif;color:var(--gold2);font-size:1.6rem;margin-bottom:12px}
.clue{padding:10px 12px;border-right:3px solid var(--red);background:var(--panel2);margin-bottom:8px;border-radius:3px;line-height:1.7}
.empty{color:var(--muted);text-align:center;padding:20px 0}
.vol{display:flex;align-items:center;gap:10px;margin:10px 0}
.vol input{flex:1;accent-color:var(--gold)}
.modal .close{margin-top:14px;width:100%}

/* ---------- مقدمة القصة ---------- */
#intro{justify-content:center;justify-content:safe center;text-align:center;gap:22px;background:rgba(5,6,10,.55);cursor:pointer}
#introBody{max-width:580px;min-height:38vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.il{font-family:'Amiri',serif;font-size:clamp(1.4rem,5.4vw,2.1rem);line-height:2;color:var(--text);opacity:0;animation:fadeUp 1s ease forwards}
.il.em{color:var(--gold2)}
#introBody .logo-sub{color:var(--gold)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.intro-dots{display:flex;gap:7px}
.intro-dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:.3s}
.intro-dots i.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.intro-hint{color:var(--muted);font-size:.8rem;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
#intro .skip{position:absolute;top:14px;left:14px;min-width:0;padding:8px 16px;font-size:.9rem}

/* ---------- الوضع الأفقي: يتبدل تلقائياً عند قلب الهاتف ---------- */
@media (orientation:landscape){
  :root{--wmax:1000px}
  .brand{display:none}
  .topbar{padding-top:6px;padding-bottom:6px;
    padding-right:max(14px,env(safe-area-inset-right));padding-left:max(14px,env(safe-area-inset-left))}
  #stage{padding-right:max(14px,env(safe-area-inset-right));padding-left:max(14px,env(safe-area-inset-left))}
  /* النص على اليمين والصورة المصغرة على اليسار */
  .inner{display:grid;grid-template-columns:1fr min(36vw,340px);column-gap:14px;align-items:start}
  .thumb{grid-column:2;grid-row:1 / span 2;position:sticky;top:0;
    height:clamp(150px,62vh,300px);height:clamp(150px,62dvh,300px);
    border:1px solid var(--line);border-radius:10px}
  .thumb.none{display:none}
  .card{grid-column:1;grid-row:1;border-radius:10px}
  #cw{grid-column:1;grid-row:2}
  #cw .ask{margin-top:12px}
}
/* هاتف أفقي قصير الارتفاع: نضغط القائمة وشاشة نهاية الفصل */
@media (orientation:landscape) and (max-height:520px){
  #menu,#endscreen{gap:6px}
  h1.title{font-size:3rem}
  .tagline{margin-bottom:8px;max-width:80vw;line-height:1.6;font-size:.9rem}
  .menu-btns{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .btn{min-width:0;padding:9px 18px;font-size:.95rem}
  #endscreen h2{font-size:1.8rem}
  #endscreen .stat{padding:6px 14px}
  #endscreen .stat b{font-size:1.2rem}
  #endscreen .menu-btns{margin-top:8px !important}
  .il{font-size:1.15rem;line-height:1.7}
  #introBody{min-height:0}
  #intro{gap:10px}
}
</style>
</head>
<body>
<div id="bg"><div class="bgl" id="bgA"></div><div class="bgl" id="bgB"></div></div>
<canvas id="rain"></canvas>
<div class="vignette"></div>
<div class="toast" id="toast"></div>

<!-- القائمة الرئيسية -->
<section class="screen active" id="menu">
  <div class="logo-sub"></div>
  <h1 class="title">الظل الأخير</h1>
  <p class="tagline">مدينة لا تنام، ومصوّر وُجد ميتاً، وصورة أخيرة لم تُلتقط بعد. كل خيار تتخذه يترك أثراً.</p>
  <div class="menu-btns">
    <button class="btn primary" id="btnNew">ابدأ قضية جديدة</button>
    <button class="btn" id="btnContinue">متابعة التحقيق</button>
    <button class="btn" id="btnSettings">الصوت</button>
  </div>
</section>

<!-- مقدمة القصة (تظهر عند «ابدأ قضية جديدة») -->
<section class="screen" id="intro">
  <button class="btn skip" id="btnSkip">تخطّي ›</button>
  <div id="introBody"></div>
  <div class="intro-dots" id="introDots"></div>
  <div class="intro-hint" id="introHint">اضغط للمتابعة</div>
  <button class="btn primary" id="btnBegin" style="display:none">ابدأ التحقيق</button>
</section>

<!-- شاشة اللعب -->
<section class="screen" id="game">
  <header class="topbar">
    <div class="tb-main">
      <div class="brand">الظل الأخير</div>
      <div class="tb-line">
        <span class="tb-title">الفصل <b id="hudChap">1</b>: <span id="hudTitle"></span></span>
        <span class="tb-stage">المرحلة <b id="hudStage">1</b> من 10</span>
      </div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="icons">
      <button class="icon-btn" id="btnNotes" title="المفكرة">📓</button>
      <button class="icon-btn" id="btnSound" title="الصوت">🔊</button>
      <button class="icon-btn" id="btnHome" title="القائمة">⌂</button>
    </div>
  </header>

  <main id="stage">
    <div class="inner">
      <div class="thumb none" id="thumb"><img id="thumbImg" alt=""></div>
      <div class="card" id="card">
        <div class="scene" id="scene"></div>
        <div id="text"></div>
        <div class="banner" id="banner">
          <span class="b-head">🔎 تم الحصول على دليل جديد</span>
          <span class="b-text" id="bannerText"></span>
        </div>
      </div>
      <div id="cw">
        <div class="ask">اختر إجراءك التالي:</div>
        <div id="choices"></div>
      </div>
    </div>
  </main>
</section>

<!-- نهاية الفصل -->
<section class="screen" id="endscreen">
  <div class="logo-sub" id="endKicker">انتهى الفصل</div>
  <h2 id="endTitle"></h2>
  <p class="tagline" id="endText"></p>
  <div class="stats">
    <div class="stat"><b id="stClues">0</b><span>أدلة</span></div>
    <div class="stat"><b id="stIntuition">0</b><span>حدس</span></div>
    <div class="stat"><b id="stLogic">0</b><span>منطق</span></div>
  </div>
  <div class="menu-btns" style="margin-top:16px">
    <button class="btn primary" id="btnNext">الفصل التالي</button>
    <button class="btn" id="btnEndHome">القائمة الرئيسية</button>
  </div>
</section>

<!-- المفكرة -->
<div class="modal" id="notesModal"><div class="box">
  <h3>📓 مفكرة المحقق</h3>
  <div id="notesList"></div>
  <button class="btn close" data-close>إغلاق</button>
</div></div>

<!-- الصوت -->
<div class="modal" id="soundModal"><div class="box">
  <h3>🔊 الصوت</h3>
  <div class="vol"><span>الموسيقى</span><input type="range" id="volMusic" min="0" max="100" value="45"></div>
  <div class="vol"><span>النقر</span><input type="range" id="volClick" min="0" max="100" value="70"></div>
  <button class="btn" id="btnMute" style="width:100%">كتم الكل</button>
  <button class="btn close" data-close>إغلاق</button>
</div></div>

<script>
/* =====================================================================
   1) بيانات القصة
   ---------------------------------------------------------------------
   لإضافة فصل جديد: أضف مفتاحاً جديداً داخل STORY بنفس بنية الفصل 1.
   كل فصل = عنوان + خاتمة + 10 مراحل (1..10).
   المرحلة: { scene, text, choices }
   text: نص أو دالة (state) => نص  (لتغيير النص بحسب اختيارات اللاعب السابقة)
   choice: { t: نص الخيار, clue?: دليل, flag?: علامة, intuition?: 1, logic?: 1 }
   الأدلة: دليلان فقط لكل فصل (MAX_CLUES_PER_CHAPTER). ضع clue في مرحلتين فقط.
   الانتقال تلقائي للمرحلة التالية، والمرحلة 10 تنهي الفصل.
   ===================================================================== */
const STORY = {
  1: {
    title: "ليلة دامبو",
    outro: "الصورة التُقطت قبل أن تعرف أنك ستأتي. من نصب الكاميرا كان يعرف أنك ستصل... وهذا يعني أنك جزء من القصة منذ البداية.",
    stages: {
      1: {
        scene: "مانهاتن — الواحدة وإحدى وأربعون دقيقة ليلاً",
        text: "المطر يضرب زجاج نافذة مكتبك في الطابق السابع منذ المساء، والمدينة التي لا تنام تبدو الليلة متعبة.\n\nأمامك قهوة باردة وتقارير لم تُكتب. ثم يرنّ الهاتف الأرضي القديم على مكتبك، ذاك الذي لا يرنّ إلا لسوء الأخبار.",
        choices: [
          { t: "أرفع السماعة فوراً", logic: 1 },
          { t: "أنظر من النافذة أولاً قبل أن أرد", intuition: 1, flag: "sawTaxi" }
        ]
      },
      2: {
        scene: "المكالمة",
        text: (s) => (s.flags.sawTaxi
          ? "من النافذة تلمح سيارة أجرة صفراء متوقفة تحت المصباح بلا راكب ولا حركة. ما إن تحدّق فيها حتى تنطفئ أضواؤها وتبتعد ببطء.\n\nترفع السماعة أخيراً. "
          : "ترفع السماعة قبل الرنة الثالثة. ") +
          "صوت شريكتك، المحققة سارة ميلر:\n\n«وُجد المصوّر إلياس كرين ميتاً في استوديوه بدامبو. الباب مقفل من الداخل والنافذة الكبيرة مفتوحة. زملاء الدورية يقولون إنه انتحار... لكن شيئاً هنا لا يبدو صحيحاً.»",
        choices: [
          { t: "«أنا في الطريق. لا تدعي أحداً يلمس شيئاً»", logic: 1 },
          { t: "«أرسلي لي ملفه أولاً. من هو إلياس كرين؟»", logic: 1, flag: "readFile" }
        ]
      },
      3: {
        scene: "دامبو، بروكلين — تحت جسر مانهاتن",
        text: "أضواء الجسر تتدلى فوق الأزقة المرصوفة بالحجارة المبتلة، وقطار بعيد يرتجّ فوق رأسك كأنه رعد. الاستوديو في مبنى مصانع قديم، وسلّمه الحديدي يئنّ تحت المطر.\n\nيستقبلك شرطي الدورية عند المدخل: «كان مقفلاً من الداخل بسلسلة وقفل يا سيدي. اضطررنا لقصّ القفل.»",
        choices: [
          { t: "أفحص السلسلة والباب أولاً", logic: 1, flag: "checkedDoor" },
          { t: "أدخل مباشرة لأرى المكان", intuition: 1 }
        ]
      },
      4: {
        scene: "الاستوديو",
        text: (s) => (s.flags.checkedDoor
          ? "السلسلة سليمة تماماً من الداخل. من غادر هذا المكان لم يخرج من الباب.\n\n"
          : "") +
          "طابق واسع بنوافذ عالية، وعلى حبال مشدودة تتدلى مئات الصور بالأبيض والأسود: ظلال مارة وسيارات وجسور، بلا وجوه. هذه كانت مهنة إلياس: يصوّر ظلال المدينة.\n\nيرقد جثمانه قرب النافذة المفتوحة. الكاميرا على حاملها موجهة نحو الباب، لا نحو النافذة، وضوء أحمر ينبعث من غرفة في آخر المكان.",
        choices: [
          { t: "أفحص الكاميرا الموجهة نحو الباب", logic: 1, flag: "sawCamera" },
          { t: "أتجه إلى الضوء الأحمر في آخر المكان", intuition: 1 }
        ]
      },
      5: {
        scene: "الغرفة المظلمة",
        text: (s) => (s.flags.sawCamera
          ? "الكاميرا في الخارج كانت بلا فيلم. من انتزعه فعل ذلك على عجل.\n\n"
          : "") +

/* =====================================================================
   2) الصوت
   ===================================================================== */
const MUSIC_TRACKS = { early: "o.mp3", late: "o2.mp3" };   // o2 يبدأ من الفصل 25
const LATE_FROM_CHAPTER = 25;
const CLICK_FILE = "r.mp3";
const CLUE_FILE = "p.mp3";            // صوت الحصول على دليل
const MAX_CLUES_PER_CHAPTER = 2;      // الحد الأقصى للأدلة في كل فصل

const Audio_ = {
  music: null, current: null, muted: false, musicVol: .45, clickVol: .7, started: false,
  init() {
    try {
      const m = JSON.parse(localStorage.getItem("dt_audio") || "{}");
      if (typeof m.musicVol === "number") this.musicVol = m.musicVol;
      if (typeof m.clickVol === "number") this.clickVol = m.clickVol;
      if (typeof m.muted === "boolean") this.muted = m.muted;
    } catch (e) {}
    this.click = new Audio(CLICK_FILE);
    this.click.preload = "auto";
    this.clue = new Audio(CLUE_FILE);
    this.clue.preload = "auto";
    this.refreshUI();
  },
  save() { try { localStorage.setItem("dt_audio", JSON.stringify({ musicVol: this.musicVol, clickVol: this.clickVol, muted: this.muted })); } catch (e) {} },
  playClick() {
    if (this.muted) return;
    try {
      const c = this.click.cloneNode();
      c.volume = this.clickVol;
      c.play().catch(() => {});
    } catch (e) {}
  },
  playClue() {
    if (this.muted) return;
    try {
      const c = this.clue.cloneNode();
      c.volume = this.clickVol;
      c.play().catch(() => {});
    } catch (e) {}
  },
  trackFor(ch) { return ch >= LATE_FROM_CHAPTER ? MUSIC_TRACKS.late : MUSIC_TRACKS.early; },
  setChapter(ch) {
    const file = this.trackFor(ch);
    if (this.current === file && this.music) return;
    this.current = file;
    const old = this.music;
    this.music = new Audio(file);
    this.music.loop = true;
    this.music.volume = 0;
    if (this.started && !this.muted) this.music.play().catch(() => {});
    this.fade(this.music, this.muted ? 0 : this.musicVol, 1500);
    if (old) { this.fade(old, 0, 1200, () => old.pause()); }
  },
  fade(a, to, ms, done) {
    const from = a.volume, t0 = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - t0) / ms);
      a.volume = Math.max(0, Math.min(1, from + (to - from) * k));
      if (k < 1) requestAnimationFrame(step); else if (done) done();
    };
    requestAnimationFrame(step);
  },
  // المتصفحات تمنع التشغيل التلقائي، لذلك نبدأ عند أول نقرة
  unlock() {
    if (this.started) return;
    this.started = true;
    if (this.music && !this.muted) this.music.play().catch(() => {});
  },
  apply() {
    if (this.music) {
      this.music.volume = this.muted ? 0 : this.musicVol;
      if (!this.muted && this.started && this.music.paused) this.music.play().catch(() => {});
    }
    this.refreshUI(); this.save();
  },
  refreshUI() {
    $("#btnSound").textContent = this.muted ? "🔇" : "🔊";
    $("#btnMute").textContent = this.muted ? "تشغيل الصوت" : "كتم الكل";
    $("#volMusic").value = Math.round(this.musicVol * 100);
    $("#volClick").value = Math.round(this.clickVol * 100);
  }
};

/* =====================================================================
   3) حالة اللعبة
   ===================================================================== */
const $ = (q) => document.querySelector(q);
const TOTAL_CHAPTERS = 50, STAGES_PER_CHAPTER = 10;
let state = newState();
let pendingClue = null;   // دليل حصل عليه اللاعب بالاختيار السابق ليظهر في المرحلة التالية

function newState() { return { ch: 1, st: 1, intuition: 0, logic: 0, clues: [], cc: 0, flags: {} }; }
function saveGame() { try { localStorage.setItem("ls_save", JSON.stringify(state)); } catch (e) {} }
function loadGame() { try { const s = JSON.parse(localStorage.getItem("ls_save")); return s && s.ch ? s : null; } catch (e) { return null; } }

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $("#" + id).classList.add("active");
  document.body.classList.toggle("playing", id === "game");
}

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2400);
}

/* =====================================================================
   4) عرض المراحل
   ===================================================================== */
let typing = null;

/* صورة الفصل (خلفية في القائمة + صورة مصغرة أثناء اللعب):
   عمودي  → m1.jpg  (m2.jpg ...)
   أفقي   → m1_land.jpg (m2_land.jpg ...) وإن لم توجد تُستخدم m1.jpg
   وإن لم يوجد أي ملف تبقى خلفية داكنة بلا صورة مصغرة. تتبدل تلقائياً عند قلب الهاتف. */
const BG_FILE = (ch, land) => land ? `m${ch}_land.jpg` : `m${ch}.jpg`;
const landMQ = matchMedia("(orientation:landscape)");
const bgA = $("#bgA"), bgB = $("#bgB"), thumbBox = $("#thumb"), thumbImg = $("#thumbImg");
let bgFront = null, bgKey = null, bgCurCh = 1;
function setBackground(ch) {
  bgCurCh = ch;
  const land = landMQ.matches, key = ch + (land ? "L" : "P");
  if (bgKey === key) return;
  bgKey = key;
  const files = land ? [BG_FILE(ch, true), BG_FILE(ch, false)] : [BG_FILE(ch, false)];
  const tryNext = (i) => {
    if (bgKey !== key) return;
    if (i >= files.length) {
      bgA.classList.remove("show"); bgB.classList.remove("show"); bgFront = null;
      thumbBox.classList.add("none");
      return;
    }
    const img = new Image();
    img.onload = () => {
      if (bgKey !== key) return;
      const next = bgFront === bgA ? bgB : bgA, prev = bgFront;
      next.style.backgroundImage = `url("${files[i]}")`;
      next.classList.add("show");
      if (prev) prev.classList.remove("show");
      bgFront = next;
      thumbImg.src = files[i];
      thumbBox.classList.remove("none");
    };
    img.onerror = () => tryNext(i + 1);
    img.src = files[i];
  };
  tryNext(0);
}
landMQ.addEventListener("change", () => setBackground(bgCurCh));

function renderStage() {
  const chapter = STORY[state.ch];
  if (!chapter) return showComingSoon();
  const stage = chapter.stages[state.st];
  $("#hudChap").textContent = state.ch;
  $("#hudTitle").textContent = chapter.title;
  $("#hudStage").textContent = state.st;
  $("#scene").textContent = stage.scene;
  $("#dots").innerHTML = Array.from({ length: STAGES_PER_CHAPTER }, (_, i) => {
    const n = i + 1; return `<i class="${n < state.st ? "done" : n === state.st ? "now" : ""}"></i>`;
  }).join("");
  buildChoices(stage);

  // شريط الدليل الجديد (يحجز مكانه ويظهر بعد انتهاء الكتابة)
  const clue = pendingClue; pendingClue = null;
  const bn = $("#banner"); bn.classList.remove("has", "show");
  if (clue) { $("#bannerText").textContent = clue; bn.classList.add("has"); }

  Audio_.setChapter(state.ch);
  setBackground(state.ch);
  $("#stage").scrollTop = 0;
  const text = typeof stage.text === "function" ? stage.text(state) : stage.text;
  typeText(text, revealChoices);
  saveGame();
}

/* النص يُرسم كاملاً من البداية (الجزء الذي لم يُكتب بعد مخفي لكنه يحجز مكانه)
   فلا يتحرك شيء على الشاشة أثناء الكتابة. */
let curParas = [];
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function paintText(n) {
  let left = n;
  $("#text").innerHTML = curParas.map((p) => {
    const k = Math.max(0, Math.min(p.length, left)); left -= p.length;
    return `<p><span>${esc(p.slice(0, k))}</span><span class="h">${esc(p.slice(k))}</span></p>`;
  }).join("");
}

function typeText(text, done) {
  if (typing) typing.cancel();
  curParas = text.split(/\n{2,}/).map((s) => s.trim()).filter(Boolean);
  const total = curParas.reduce((a, p) => a + p.length, 0);
  paintText(0);
  let i = 0, finished = false, timer;
  const finish = () => {
    if (finished) return; finished = true; clearInterval(timer);
    paintText(total); typing = null; done();
  };
  timer = setInterval(() => {
    i += 2; paintText(i);
    if (i >= total) finish();
  }, 24);
  typing = { cancel() { finished = true; clearInterval(timer); }, finish };
}

/* الخيارات تُبنى فوراً لكنها مخفية (تحجز مكانها)، وتظهر بعد انتهاء الكتابة */
function buildChoices(stage) {
  const box = $("#choices"); box.innerHTML = ""; $("#cw").classList.remove("ready");
  stage.choices.forEach((c) => {
    const b = document.createElement("button");
    b.className = "choice"; b.textContent = c.t;
    b.onclick = () => choose(c);
    box.appendChild(b);
  });
}
function revealChoices() {
  $("#cw").classList.add("ready");
  const bn = $("#banner"); bn.classList.add("show");
  if (bn.classList.contains("has")) Audio_.playClue();
  // إن كانت الخيارات خارج الشاشة نمرّر لأسفل بالقدر اللازم فقط
  setTimeout(() => {
    const st = $("#stage"), r = $("#choices").getBoundingClientRect(), s = st.getBoundingClientRect();
    if (r.bottom > s.bottom) st.scrollBy({ top: r.bottom - s.bottom + 14, behavior: "smooth" });
  }, 120);
}

function choose(c) {
  if (c.intuition) state.intuition += c.intuition;
  if (c.logic) state.logic += c.logic;
  if (c.flag) state.flags[c.flag] = true;
  pendingClue = null;
  if (c.clue && !state.clues.includes(c.clue) && (state.cc || 0) < MAX_CLUES_PER_CHAPTER) {
    state.clues.push(c.clue);
    state.cc = (state.cc || 0) + 1;
    if (state.st >= STAGES_PER_CHAPTER) { toast("📓 دليل جديد في المفكرة"); Audio_.playClue(); } else pendingClue = c.clue;
  }
  if (state.st >= STAGES_PER_CHAPTER) return endChapter();
  state.st++;
  renderStage();
}

function endChapter() {
  const chapter = STORY[state.ch];
  $("#endKicker").textContent = `نهاية الفصل ${state.ch}`;
  $("#endTitle").textContent = chapter.title;
  $("#endText").textContent = chapter.outro || "";
  $("#stClues").textContent = state.clues.length;
  $("#stIntuition").textContent = state.intuition;
  $("#stLogic").textContent = state.logic;
  const hasNext = !!STORY[state.ch + 1];
  $("#btnNext").textContent = hasNext ? "الفصل التالي" : "الفصل التالي (قريباً)";
  $("#btnNext").disabled = !hasNext;
  // نحفظ بداية الفصل التالي كي يتابع اللاعب منها
  if (state.ch < TOTAL_CHAPTERS) { state.ch++; state.st = 1; state.cc = 0; }
  saveGame();
  show("endscreen");
}

function showComingSoon() {
  show("endscreen");
  $("#endKicker").textContent = `الفصل ${state.ch}`;
  $("#endTitle").textContent = "يتبع...";
  $("#endText").textContent = "هذا الفصل لم يُكتب بعد.";
  $("#btnNext").disabled = true;
}

function startGame(fresh) {
  Audio_.unlock();
  if (fresh) state = newState(); else state = loadGame() || newState();
  pendingClue = null;
  if (fresh) { show("intro"); startIntro(); return; }   // قضية جديدة: تبدأ بالمقدمة
  show("game");
  renderStage();
}

  ["أنت محقق في قسم الجرائم الكبرى.", "سنوات من القضايا التي أُغلقت...", "وواحدة منها لم تغادرك أبداً."],
  ["الليلة سيرنّ هاتف في ساعة لا يتصل فيها أحد بخبر سار.", "ومن هنا تبدأ قصة لن تخرج منها كما دخلتها."]
];

function startIntro() { introIdx = 0; renderIntro(); }
function renderIntro() {
  const last = introIdx >= INTRO.length, body = $("#introBody");
  $("#introDots").innerHTML = Array.from({ length: INTRO.length + 1 }, (_, i) => `<i class="${i === introIdx ? "on" : ""}"></i>`).join("");

  $("#introHint").style.visibility = last ? "hidden" : "visible";

    body.innerHTML = '<div class="logo-sub il" style="animation-delay:.1s;font-size:.9rem">قصة بوليسية تفاعلية · نيويورك</div>' +
                     '<h1 class="title il" style="animation-delay:.6s">الظل الأخير</h1>';

  }
  const lines = INTRO[introIdx];

    `<div class="il${i === lines.length - 1 ? " em" : ""}" style="animation-delay:${(.2 + i * .9).toFixed(1)}s">${l}</div>`).join("");

function nextIntro() { if (introIdx < INTRO.length) { introIdx++; renderIntro(); } }
function beginInvestigation() { show("game"); renderStage(); }

(function rain() {
  const c = $("#rain"), ctx = c.getContext("2d");
  let w, h, drops;
  function size() {
    w = c.width = innerWidth; h = c.height = innerHeight;
    drops = Array.from({ length: Math.floor(w / 6) }, () => ({ x: Math.random() * w, y: Math.random() * h, l: 10 + Math.random() * 18, v: 9 + Math.random() * 9 }));
  }
  addEventListener("resize", size); size();
  (function loop() {
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "rgba(170,190,220,.35)"; ctx.lineWidth = 1; ctx.beginPath();
    drops.forEach(d => {
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 2, d.y + d.l);
      d.y += d.v; d.x -= .6;
      if (d.y > h) { d.y = -20; d.x = Math.random() * w; }
    });
    ctx.stroke(); requestAnimationFrame(loop);
  })();
})();

/* =====================================================================
   7) بدء التشغيل
   ===================================================================== */
Audio_.init();
Audio_.setChapter(1);
setBackground(1);
refreshMenu();

// للاختبار فقط: افتح الملف بـ ?ch=25 لتسمع أغنية الفصل 25 (o2.mp3)
const testCh = parseInt(new URLSearchParams(location.search).get("ch"), 10);
if (testCh) { Audio_.setChapter(testCh); }
</script>
